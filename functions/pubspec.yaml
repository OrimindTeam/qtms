name: qtms_functions
description: "العمليات السحابية لـQTMS — بلغة Dart، بطبقة النطاق نفسها المشتركة مع التطبيق."
# ⛔ حزمة داخلية — لا تُنشَر على pub.dev.
publish_to: 'none'
version: 1.0.0

# ★ ADR-0009 ② · ADR-0012: تُبنى هذه الحزمة في حاوية بـ**Dart SDK بلا Flutter**.
#   ⛔ فلا تعتمد `flutter` ولا أي حزمة تعتمده — وإلا فشل `dart pub get` في
#   الحاوية. وهذا القيد **يُفحَص بالبناء** لا بالمراجعة (Dockerfile).

environment:
  sdk: ^3.11.5

dependencies:
  # ★ طبقة النطاق نفسها التي يستوردها التطبيق — مصدر واحد للمعادلة والصيغة.
  qtms_domain:
    path: ../packages/qtms_domain

  # حزمة Google الرسمية لتشغيل الدوال بـDart على Cloud Run — ADR-0009 ②.
  functions_framework: ^0.4.3
  # عميل قاعدة البيانات عبر واجهة REST الرسمية (لا SDK إداري بـDart).
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  # مُستورَدة صراحةً لأن `FirestoreWriter` يُصرِّح بنوع `http.Client`.
  http: ^1.5.0
  # ★ مُستورَدة صراحةً لأن غلاف الاستدعاء يُصرِّح بأنواع `Request`/`Response`
  #   — و`depend_on_referenced_packages: error` يرفض الاعتماد العابر.
  shelf: ^1.4.2

dev_dependencies:
  build_runner: ">=2.4.0 <2.15.3"
  functions_framework_builder: ^0.4.10
  lints: ^6.1.0
  test: ^1.26.3
