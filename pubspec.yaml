name: qtms
description: "QTMS — نظام محاسبي لإدارة المخزون والذمم والنقد في تجارة القات."
# ⛔ حزمة خاصة — لا تُنشَر على pub.dev.
publish_to: 'none'

# ترقيم الإصدار وفق docs/12-deployment-and-release/versioning-scheme.md
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ★ ADR-0012: طبقة النطاق في حزمة Dart نقية مستقلة يشاركها التطبيق
  #   والعمليات السحابية — بمسار محلي، فهي حزمة داخلية لا تُنشَر.
  qtms_domain:
    path: packages/qtms_domain
  # ترجمات ويدجات Material للعربية واتجاهها — حزمة من SDK لا طرف ثالث.
  # localization-strategy.md §1: لغة واحدة (العربية) واتجاه فعّال واحد (RTL).
  flutter_localizations:
    sdk: flutter

  # ★ الاعتماديات مقتصرة على ما يحتاجه المخرَج 9 من «الخطوة صفر» فعلاً.
  #   technology-stack.md §6 البند 1: «هل تحلّ مشكلة فعلية قائمة الآن؟ (لا
  #   استباقاً)» — ولذلك لا Riverpod ولا go_router ولا freezed بعد؛ تُضاف كل
  #   واحدة في الزيادة التي تحتاجها أولاً.
  firebase_core: ^4.4.0
  cloud_firestore: ^6.2.0
  # ★ WU-001: المصادقة — technology-stack.md §1 «Firebase Authentication».
  firebase_auth: ^6.3.0
  # ★ WU-001: إدارة الحالة — ADR-0010 (Riverpod) · وحقن الاعتمادية الصريح
  #   هو ما يجعل مزوّد الصلاحيات يُقرأ بلا تمرير يدوي عبر الشجرة.
  flutter_riverpod: ^3.0.3
  # ★ WU-001: الملاحة — ADR-0009 · technology-stack.md §1 «go_router».
  go_router: ^16.2.4
  # ★ WU-001 (IQ-015): استدعاء العمليات السحابية ببروتوكولها المكتوب يدوياً.
  #   ⛔ ولا `cloud_functions`: الخدمات على **Cloud Run** في `me-central1`
  #   (ADR-0009 ② · ADR-0014) لا على Firebase Functions، فحزمتها لا تُخاطبها.
  http: ^1.2.2
  # ★★ WU-010 (M20) — أربع حزم لأربع حاجات مقيسة، ⛔ لا واحدة زائدة.
  #   مبررُ قبول كلٍّ منها في dependency-management-policy.md §7.
  #
  # ⛔⛔ ولا حزمةَ طباعةٍ ولا بلوتوث — ADR-0023 (مقترح · IQ-033): الطباعة
  #   الحرارية خارج النطاق، ⟵ فالأذونات المعتمدة في §3 من سياسة الاعتماديات
  #   (جهات الاتصال · التخزين) تبقى كما هي بلا استثناء.
  #
  # ★ FR-M20-14: «كل السندات قابلة للتصدير PDF» — توليدُ الملف.
  pdf: ^3.12.0
  # ★ FR-M20-14: «ومشاركتها كملف عبر واتساب» — ورقةُ المشاركة النظامية.
  share_plus: ^13.3.0
  # ★ موضعُ الملف المؤقت قبل مشاركته — ⛔ ولا مسارَ محفورٌ نصياً.
  path_provider: ^2.1.6
  # ★ FR-M20-01: زرّا واتساب وSMS — فتحُ المحادثة بنصٍّ جاهز.
  #   ⛔ ولا إرسالَ تلقائي: «النظام يفتح المحادثة ولا يرسل» (FR-M20 §1).
  url_launcher: ^6.3.2
  local_auth: ^3.0.2
  flutter_secure_storage: 10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ★★ DEBT-57: اختبارُ المهلة يحتاج زمناً مُزيَّفاً — ⛔ لا انتظاراً حقيقياً
  #    عشرين ثانية في كل تشغيل. ★ وهي تبعيةٌ ينقلها `flutter_test` أصلاً،
  #    ⟵ **وتُعلَن صراحةً** لأن `depend_on_referenced_packages` يمنع الضمني.
  fake_async: ^1.3.1
  # ★★ DEBT-82: اختبارُ بوابة البصمة يحتاج بديلاً مزيَّفاً لـ`LocalAuthentication`،
  #    ⟵ وتوقيعُ `authenticate` فيها يذكر `AuthMessages` ⛔ وهي غيرُ مُصدَّرة
  #    من `package:local_auth`. ★ وهي تبعيةٌ ينقلها `local_auth` أصلاً،
  #    ⟵ وتُعلَن صراحةً لأن `depend_on_referenced_packages` يمنع الضمني —
  #    ★ نفسُ مسار `fake_async` أعلاه حرفياً. ⛔ ولا تدخل الحزمة المنشورة.
  local_auth_platform_interface: ^1.1.0
  # ★ AM-002: مولّد أيقونة التطبيق المتكيّفة من شعار العميل.
  #   ⛔ اعتمادية تطوير لا تدخل الحزمة المنشورة — أداة بناء تُشغَّل يدوياً
  #   عند تغيّر ملفات `assets/icons/` وحدها (`build-and-run-instructions.md`
  #   §4.1)، ⛔ لا في كل بناء. مبرر قبولها في
  #   `docs/07-development/dependency-management-policy.md` §7 البند 1.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # ★ نصّا رخصة الخطّين — يُسجَّلان في سجل الرخص عند الإقلاع
    #   (third-party-assets-licenses.md §2 و§6). ★★ وملفان لا ملفٌ واحد:
    #   ⛔ مالكا حقوقٍ مختلفان، ودمجُهما يُفقد أحدَ الإسنادين.
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Tajawal.txt
    # ★ AM-002: شعار العميل — الطبقة الأمامية وحدها هي ما تعرضه الواجهة،
    #   ⛔ ولا يُشار إليها من شاشة مباشرةً: `BrandLogo` وحده يقرأ المسار
    #   (`lib/core/design/brand.dart`) — نفس قاعدة «الشاشة لا تلمس الطبقة
    #   الأولية» المطبَّقة على التوكنز.
    - assets/icons/app-icon-foreground.png
    # ★★ WU-010: ملفّا الخط يُقرآن من حزمة الأصول لتضمينهما في الـPDF.
    #
    # ⛔⛔ ولا يكفي إعلانُهما تحت `fonts:` وحده: ذاك يُسجِّلهما في محرّك
    #    النصّ، ★ وقارئُ الحزمة (`rootBundle.load`) يحتاج مسارَ أصلٍ معلَناً.
    # ★ وملفٌّ واحد لا نسختان: Flutter يُضمِّن المسار مرةً واحدة.
    #
    # ⛔ ولا خطَّ نظامي بديلاً في الـPDF: الخطوط النظامية لا تُضمَّن في الملف،
    #    ⟵ فيُقرأ صحيحاً على الجهاز الذي أنشأه وحده ويظهر فارغاً عند المستلِم.
    - assets/fonts/IBMPlexSansArabic-Regular.ttf
    - assets/fonts/IBMPlexSansArabic-SemiBold.ttf
    # ★★★ FR-SYS-28/29: بصمةُ جهة التطوير — مصدرُ حقيقةٍ واحد داخل المشروع
    #   (`developer-identity.md` §6 · `developer-identity-placement.md` §6).
    #
    # ⛔⛔ ولا يُقرأ هذان من شاشةٍ مباشرةً: `DeveloperIdentity` وحدها تقرؤهما
    #    (`lib/core/identity/developer_identity.dart`) — نفس قاعدة «الشاشة لا
    #    تلمس الطبقة الأولية» المطبَّقة على التوكنز وعلى شعار العميل أعلاه.
    - assets/branding/developer-identity.json
    - assets/branding/logo-mark.png

  fonts:
    # ★ الخط المعتمَد — design-tokens.md §5 · 19-assets/fonts/README.md.
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        # ⚠️ ★ استبدال موثَّق: الوزن 700 غير مضمَّن في الحزمة المعتمدة،
        #    و19-assets/fonts/README.md §1 يُجيز «الاستعاضة عنه بـ600 بقرار
        #    موثَّق» ⛔ ويمنع تركه للمحاكاة الآلية (Faux Bold) لأنها تُشوّه
        #    الحروف العربية. ⟵ فالوزن 700 يُربَط صراحةً بملف 600.
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 700

    # ★★ خط العرض الثاني — design-tokens.md §5-أ · 19-assets/fonts/README.md §4.
    #   ⛔⛔ ولا رقمَ به إطلاقاً: أرقامُه اللاتينية بتسعة عروضٍ مختلفة وميزةُ
    #   `tnum` غائبةٌ عن `GSUB` (فحصٌ على الملفين لا على صفحة العرض) ⟵ فطلبُها
    #   يُتجاهَل بصمت فيرتجّ عمودُ الرقم. ★ ووزنان فقط — والعائلةُ لا تحمل 600.
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900

# ★★ AM-002 — إعداد مولّد الأيقونة المتكيّفة من شعار العميل.
#
# ⛔ **ولا أيقونة Flutter الافتراضية بعد اليوم**: المصدر ملفّا `RF-001`
#    المعتمدان (`docs/19-assets/icons/` — والنسخة التنفيذية `assets/icons/`).
#
# ★ يُعاد التوليد بأمر واحد عند تغيّر الأصل:  dart run flutter_launcher_icons
# ⛔ ولا يُحرَّر أي ملف داخل `android/app/src/main/res/mipmap-*` يدوياً.
flutter_launcher_icons:
  android: true
  # ⛔ لا iOS: خارج نطاق هذا الإصدار صراحةً (`technology-stack.md` §5).
  ios: false

  # ★ طبقتا الأيقونة المتكيّفة — **تعملان على API 26 فما فوق وحدها**،
  #   ويولّدهما المولّد في `mipmap-anydpi-v26/` ⟵ **مجلدٌ موسومٌ بالإصدار**،
  #   ⛔ **فلا يقرؤه API 24/25 إطلاقاً** (`AM-011`).
  adaptive_icon_foreground: assets/icons/app-icon-foreground.png
  adaptive_icon_background: assets/icons/app-icon-background.png

  # ⛔⛔★★★ ومورد `ic_launcher` المربَّع هو **الأيقونة الفعلية الوحيدة على
  #    أندرويد 7.0/7.1** بعد `AM-011` — ★ **لا احتياطاً نظرياً كما كان.**
  #    يُولَّد من أيقونة المتجر لأنها **بلا شفافية** فتصلح خلفيةً مصمتة.
  #    ⚠️ وتركه بلا قيمة يُبقي أيقونة Flutter الافتراضية محفورة في الحزمة.
  image_path: assets/icons/app-icon-store-512.png
  # ★★ الأرضيةُ المعتمدة — `AM-011` · `CR-010` (معتمَد 2026-09-02).
  # ⚠️★★ ومُعلَنةٌ للاتساق لا للأثر: **`flutter_launcher_icons` 0.14.4 يقرأ
  #    هذا المفتاح ولا يستعمله في أي فرع توليد** (فُحص في مصدر الحزمة:
  #    `config.minSdkAndroid` بلا قارئ، و`android.minSdk()` بلا مُستدعٍ)
  #    ⟵ **فالمولّد ينتج `mipmap-*/ic_launcher.png` و`mipmap-anydpi-v26/`
  #    معاً دائماً**، ⛔ **وتركُه على 26 كان يكذب على القارئ لا على الأداة.**
  min_sdk_android: 24
